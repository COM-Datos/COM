<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>COM</title>
<link rel="icon" type="image/png" href="../assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../assets/llave.js"></script>
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --border:#E6E2DA; --border2:#D6D1C8;
  --text:#1A1714; --text2:#5F5A54; --text3:#9A948C; --grid:#EEEBE5;
  --teal:#39745E; --teal-bg:#DCEDE4;
  --pend:#eb6834; --pend-bg:#FCE9DF;
  --atr:#d03b3b;  --atr-bg:#F9E1E0;
  --asig:#2a78d6; --asig-bg:#E1ECFA;
  --hecho:#1baf7a;--hecho-bg:#DDF3EA;
  --gris:#B5AFA6;
  --shadow:0 4px 20px rgba(26,23,20,.05),0 1px 3px rgba(26,23,20,.05);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
/* Lugar de la barra de desplazamiento siempre reservado: el ancho de la página no cambia entre pestañas cortas y largas */
html{scroll-behavior:smooth;overflow-y:scroll;scrollbar-gutter:stable}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 12% 0%,#EDEEF9 0%,transparent 40%),radial-gradient(circle at 95% 100%,#E7F3EE 0%,transparent 40%),var(--bg);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:1440px;margin:0 auto;padding:1.5rem clamp(16px,2.5vw,2rem) 3rem}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* Barra del título: igual a la de los dashboards de COM-Datos/Dashboard */
.barra{background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
/* Mismo ancho y márgenes que .wrap; el título va centrado (se actualiza y se vuelve desde el menú principal) */
.barra-in{max-width:1440px;margin:0 auto;min-height:84px;padding:12px clamp(16px,2.5vw,2rem);display:flex;justify-content:center;align-items:center}
.titulo{display:flex;align-items:center;gap:10px;min-width:0}
/* ♻ en versión emoji a color, igual que en COM-Datos/Dashboard/bolsones.html */
.titulo .ico{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:32px;height:32px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:26px;font-weight:700;line-height:32px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.titulo h1{font-family:'Segoe UI',Arial,sans-serif;font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.15}

/* Botoneras segmentadas (capas del mapa) */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--text);color:#fff}
.seg input[type=date]{border:0;background:transparent;font:inherit;font-size:13px;color:var(--text2);padding:0 8px;outline:none}
.seg input.on{color:var(--text);font-weight:600}

/* Semana */
.semana{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
/* Tarjetas de la semana (solo informativas): municipios con su planta y vaciados fijos del día */
.dia{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.75rem .75rem .8rem;box-shadow:var(--shadow)}
.dia.hoy{border-color:var(--teal);background:linear-gradient(180deg,#F1F8F4 0%,var(--card) 70%);box-shadow:0 0 0 3px var(--teal-bg),var(--shadow)}
.dia-n{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.1px;padding-bottom:.55rem;margin-bottom:.6rem;border-bottom:1px solid #F0EDE7}
.dia.hoy .dia-n{color:var(--teal);border-bottom-color:#D5E8DD}
.dia-sec{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.45rem}
.dia-sec.sig{margin-top:.8rem;padding-top:.7rem;border-top:1px solid #F0EDE7}
.dia.hoy .dia-sec.sig{border-top-color:#D5E8DD}
.dia-fijos{display:flex;flex-direction:column;gap:6px}
.dia-hoy{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--teal);border-radius:99px;padding:1px 8px 3px}
/* Un renglón por municipio: etiqueta "Municipio X" → planta donde descarga */
.dia-rows{display:grid;grid-template-columns:auto auto minmax(0,1fr);grid-auto-rows:22px;align-items:center;gap:7px 6px}
.dia-rows .mb{font-size:11.5px;padding:0 12px 0 8px;min-width:100px} /* mismo ancho en todas: las plantas arrancan en la misma vertical */
/* Subtítulo "Municipios → Descarga" en una línea, con la misma flecha que los renglones */
.dia-sec-cols{display:flex;align-items:center;gap:6px}
.dia-fl{width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dia-p{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#FAF9F6;border:1px solid #EFECE6;border-left:4px solid var(--c,var(--gris));border-radius:9px;padding:.4rem .45rem .4rem .55rem}
.fv-n{font-size:12px;font-weight:700;line-height:1.3;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv .mb{flex:none;order:2;height:20px;min-width:22px;padding:0 8px 0 4px;font-size:11px}
.dia-vacio{font-size:12px;color:var(--text3);padding:.2rem .15rem}
.mb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 10px 0 6px;border-radius:7px;border-left:4px solid transparent;background:#F0EDE7;color:var(--text);font-size:12px;font-weight:700}

/* Tarjetas y mapa */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.mapa-card{position:relative;overflow:hidden;isolation:isolate;height:640px;display:flex;flex-direction:column}
.mapa-bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem .8rem;border-bottom:1px solid var(--border)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--text2)}
.tg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tg.off{opacity:.42}
.tg.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
#mapaOp{flex:1;background:#EFEDE8}
.mapa-op{height:600px;margin-bottom:14px}
.mapa-op .toggles{margin-left:0}
.leaflet-container{font:inherit}
.leaflet-tooltip{border-radius:8px;border:1px solid var(--border);box-shadow:var(--shadow);font-size:12px;color:var(--text);padding:4px 8px}
.ficha{position:absolute;left:12px;bottom:12px;z-index:900;width:min(340px,calc(100% - 24px));background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(26,23,20,.16);padding:.9rem 1rem;display:none}
.ficha.on{display:block}
.ficha-x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:18px;color:var(--text3);line-height:1}
.ficha h3{font-size:15px;font-weight:700;padding-right:18px;line-height:1.25}
.ficha .sub{font-size:12px;color:var(--text2);margin-top:2px}
.ficha .sub .mb{height:19px;min-width:22px;font-size:11px;vertical-align:1px;margin-left:2px}
.ficha hr{border:0;border-top:1px solid var(--border);margin:.6rem 0}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.ficha dt{color:var(--text3)}
.ficha dd{color:var(--text);min-width:0;overflow-wrap:anywhere}
.est{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--bg-c);color:var(--c)}
.est::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
/* Pestañas Para borrar e Ingreso */
.sec-t{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:.8rem}
.rep-sol{display:flex;flex-direction:column;gap:6px}
.rep-fila{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--text2)}
.rep-fila b{font-weight:700;color:var(--text)}
.ing-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.ing-f{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2)}
.ing-f input{font:inherit;font-size:13px;font-weight:600;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:6px 10px;background:var(--card)}
.ing-tot{font-size:13px;color:var(--text2)}
.ing-tot b{font-size:15px;color:var(--text)}
.tabla-wrap+.tabla-wrap{margin-top:1.4rem} /* separa la tabla de "falta algo" de la de completas */
/* Cada columna mide lo justo (width:1% + sin cortes de línea) y la última se queda con el espacio que sobra.
   Todo centrado menos la última. El ancho común entre las dos tablas lo pone igualarColumnas(). */
/* (.tabla.tabla-ing para ganarle al text-align:left de .tabla th, que está más abajo) */
.tabla.tabla-ing th,.tabla.tabla-ing td{text-align:center}
.tabla.tabla-ing th:not(:last-child),.tabla.tabla-ing td:not(:last-child){width:1%;white-space:nowrap}
.tabla.tabla-ing th:last-child,.tabla.tabla-ing td:last-child{text-align:left}
.tabla.tabla-ing td.at-vacio{text-align:center}
.falta{display:inline-block;font-size:11px;font-weight:700;color:#B4521E;background:#FCE9DF;border-radius:99px;padding:2px 9px 3px;margin:2px 2px;white-space:nowrap}
/* Tabla cerrada tipo planilla: todas las celdas con línea gris clara, borde exterior redondeado */
.tabla-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid #E6E2DA;border-radius:10px}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:.55rem .7rem;background:#F7F6F3;border:1px solid #E6E2DA;white-space:nowrap}
.tabla td{padding:.5rem .7rem;border:1px solid #ECE9E3;vertical-align:middle}
/* El borde exterior lo pone .tabla-wrap: se sacan los de las celdas de los costados para que no quede doble */
.tabla tr>:first-child{border-left:0}
.tabla tr>:last-child{border-right:0}
.tabla thead th{border-top:0}
.tabla tbody tr:last-child td{border-bottom:0}
.tabla .c{text-align:center}
.tabla .dir{font-weight:700;white-space:nowrap}
.tabla .hora{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text2)}
.tabla .desc{color:var(--text2);min-width:240px}

/* Pestaña Atrasados */
.atr-card{padding:1.1rem 1.2rem 1.2rem;margin-bottom:14px}
/* Matriz municipio × antigüedad como mapa de calor */
.hm-wrap{overflow-x:auto;overflow-y:hidden} /* barra solo si de verdad no entra (celular) */
.hm{display:grid;grid-template-columns:max-content repeat(8,minmax(46px,1fr));gap:6px;align-items:center;min-width:520px}
.hm-h{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:center}
.hm-h.izq{text-align:left}
.hm-l{display:flex;align-items:center;padding-right:8px;font-size:13px;font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hc{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;background:#F5F3EF;color:var(--text)}
.hc.cero{color:transparent}
/* Detalle: una tarjeta por dirección atrasada */
.at-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.at-it{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:#FAF9F6;border:1px solid #EFECE6;border-left:5px solid var(--m);border-radius:12px;padding:.85rem 1rem}
.at-dir{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.at-sub{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--text2)}
.at-sub span{display:inline-flex;align-items:center;gap:4px}
.at-sub svg{width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.at-vacio{text-align:center;color:var(--text2);font-size:14px;font-weight:600;padding:1.4rem 1rem}
.at-desc{grid-column:1/-1;font-size:12.5px;color:var(--text);background:var(--card);border:1px solid #EFECE6;border-radius:9px;padding:.5rem .65rem;line-height:1.4}
@media (max-width:760px){.at-lista{grid-template-columns:1fr}}

/* Gráficas */
/* Barra de categorías (mismo azul que la barra del título) */
.cats{position:sticky;top:10px;z-index:1100;display:flex;gap:6px;padding:6px;margin-bottom:14px;border-radius:14px;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);box-shadow:0 4px 12px rgba(15,23,42,.25);overflow-x:auto;scrollbar-width:none}
.cats button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:#c7d5ea;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:10px;white-space:nowrap;transition:background-color .15s,color .15s}
.cats button:hover{background:rgba(255,255,255,.08);color:#fff}
.cats button.on{background:#fff;color:#0f172a;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.cats svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat{display:none}
.cat.on{display:block}
.graficas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g{padding:1rem 1.1rem 1.1rem;min-width:0}
.g.ancha{grid-column:1/-1}
.g-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.7rem;flex-wrap:wrap}
.g-t{font-size:15px;font-weight:700;letter-spacing:-.2px}
.g-k{display:flex;gap:12px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.g-k span{display:inline-flex;align-items:center;gap:5px}
.g-k i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.g-c{position:relative;height:280px}
.g-vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px}

/* Mapa de calor hora x día */
.calor{display:grid;grid-template-columns:42px repeat(15,1fr);gap:3px;font-size:11px;color:var(--text3)}
.calor .c{aspect-ratio:1.5;border-radius:4px;background:#F2F0EC;min-height:18px}
.calor .ly{display:flex;align-items:center;font-weight:600}
.calor .lx{text-align:center}

.cargador{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5000;font-size:14px;color:var(--text2)}

/* 6 días por fila solo cuando entran los nombres de las plantas en un renglón */
@media (max-width:1439px){
  .semana{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .semana{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dia{min-width:0}
  .graficas{grid-template-columns:1fr}
  .mapa-card{height:540px}
  .barra-in{padding:10px 16px;min-height:64px}
  .titulo h1{font-size:21px}
  .titulo .ico{width:26px;height:26px;font-size:21px;line-height:26px}
  .toggles{margin-left:0}
  .calor{grid-template-columns:34px repeat(15,1fr);gap:2px;font-size:10px}
}
</style>
</head>
<body>
<div class="cargador" id="cargador">Cargando datos…</div>
<header class="barra">
  <div class="barra-in">
    <div class="titulo">
      <span class="ico" aria-hidden="true">♻</span>
      <h1>Supervisión de Bolsones</h1>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- Categorías: cada botón muestra uno de los bloques .cat de abajo -->
  <nav class="cats" id="cats">
    <button data-cat="organizacion" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Organización del servicio</button>
    <button data-cat="atrasados"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg>Atrasados</button>
    <button data-cat="operacion"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Operación del día</button>
    <button data-cat="borrar"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>Para borrar</button>
    <button data-cat="ingreso"><svg viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M4 13 6.5 5h11L20 13v6H4z"/><path d="M12 3v7M9.5 7.5 12 10l2.5-2.5"/></svg>Ingreso</button>
  </nav>

  <!-- Datos fijos del servicio: municipios y planta de cada día, vaciados fijos -->
  <div class="cat on" data-cat="organizacion">
  <section class="semana" id="semana"></section>
  </div>

  <!-- Réplica de la hoja "Atrasados": vaciados pendientes por antigüedad y municipio, y el detalle -->
  <div class="cat" data-cat="atrasados">
  <section class="card atr-card">
    <div class="hm-wrap"><div class="hm" id="hmAtraso"></div></div>
  </section>
  <section class="card atr-card">
    <div id="atLista"></div>
  </section>
  </div>

  <div class="cat" data-cat="operacion">
  <div class="card mapa-card mapa-op">
    <div class="mapa-bar"><div class="toggles" id="opToggles"></div></div>
    <div id="mapaOp"></div>
    <div class="ficha" id="fichaOp"></div>
  </div>
  <section class="graficas">
    <div class="card g">
      <div class="g-h"><div class="g-t">Gestiones por transportista</div></div>
      <div class="g-c" id="wTransp"><canvas id="cTransp"></canvas></div>
    </div>
    <div class="card g">
      <div class="g-h"><div class="g-t">Bolsones descargados por planta</div></div>
      <div class="g-c"><canvas id="cPlanta"></canvas></div>
    </div>
    <div class="card g">
      <div class="g-h"><div class="g-t">Ingresos por tipo de edificio</div></div>
      <div class="g-c"><canvas id="cEdif"></canvas></div>
    </div>
    <div class="card g">
      <div class="g-h"><div class="g-t">Bolsones gestionados por tipo</div></div>
      <div class="g-c"><canvas id="cTipo"></canvas></div>
    </div>
    <div class="card g ancha">
      <div class="g-h"><div class="g-t">¿Cuándo se gestiona?</div><div class="g-k" style="color:var(--text3)">gestiones por día de la semana y hora</div></div>
      <div class="calor" id="calor"></div>
    </div>
  </section>
  </div>

  <!-- Réplica de la hoja "Repetidos": direcciones con más de una solicitud abierta y descripciones que piden borrar -->
  <div class="cat" data-cat="borrar">
  <section class="card atr-card">
    <div class="sec-t">Direcciones repetidas</div>
    <div id="repLista"></div>
  </section>
  <section class="card atr-card">
    <div class="sec-t">Descripción para borrar</div>
    <div id="borLista"></div>
  </section>
  </div>

  <!-- Réplica de la hoja "Seguimiento ingreso": solicitudes ingresadas en la fecha elegida -->
  <div class="cat" data-cat="ingreso">
  <section class="card atr-card">
    <div class="ing-bar">
      <label class="ing-f">Fecha <input type="date" id="ingDia"></label>
      <span class="ing-tot" id="ingTot"></span>
    </div>
    <div class="tabla-wrap"><table class="tabla tabla-ing" id="tIngFalta"></table></div>
    <div class="tabla-wrap"><table class="tabla tabla-ing" id="tIngOk"></table></div>
  </section>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Fuente de datos. Hoy es una copia sin datos personales generada con
// dashboard-bolsones/build_datos.py. Más adelante se cambia por el webhook de
// n8n (vía ngrok), que tiene que devolver el mismo formato JSON.
const CONFIG = {
  fuente: '../bases/bolsones.json',
  // Qué municipio se atiende cada día, en qué planta descarga y los vaciados fijos. Se edita a mano.
  calendario: '../bases/bolsones-calendario.json',
};
const CARTO_KEY = 'cb1_4dpf_1_b2ca9299be611862d5d23c88';
// ─────────────────────────────────────────────────────────────────────────────

const MUNIS = ['A', 'B', 'C', 'CH', 'D', 'E', 'F', 'G'];

// Color de cada municipio: el mismo del formato condicional de la hoja Indicadores
// de SUPERVISION BOLSONES. Se usa en todas las etiquetas de municipio de la página.
const COLOR_MUNI = { A: '#C2A289', B: '#FFE599', C: '#B6D7A8', CH: '#6D9EEB', D: '#F9CB9C', E: '#93C47D', F: '#B4A7D6', G: '#A64D79' };
// Etiqueta de municipio: fondo neutro con la marca de color a la izquierda (como los vaciados fijos)
const chipMuni = (m, largo) => `<span class="mb" style="border-left-color:${COLOR_MUNI[m] || 'var(--gris)'}">${largo ? 'Municipio ' : ''}${esc(m)}</span>`;
// Día de servicio de cada municipio (ISO: 1 = lunes). CH va viernes y sábado;
// la planilla toma el sábado para calcular el atraso, se replica igual.
const DIA_SERVICIO = { B: 1, F: 1, A: 2, G: 2, E: 3, C: 4, D: 4, CH: 6 };
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const ATRASO = [
  { n: 'Sin atraso', c: '#F2C29C' },
  { n: '1 semana', c: '#E98A4F' },
  { n: '2 semanas', c: '#D45E26' },
  { n: '3 semanas', c: '#A8431A' },
  { n: '4 semanas o más', c: '#6E2A0F' },
];
const COL = { pend: '#eb6834', atr: '#d03b3b', asig: '#2a78d6', hecho: '#1baf7a', gris: '#B5AFA6' };
const RE_ENTREGA = /entrega|cambio/i;

const st = {
  munis: new Set(), q: '',  // filtros por municipio y búsqueda (sin controles por ahora)
  ingDia: null,             // fecha elegida en la pestaña Ingreso (por defecto hoy)
};
let D, HOY, HOYk;

// ── utilidades ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('es-UY', { maximumFractionDigits: 1 });
const pad = n => String(n).padStart(2, '0');
const clave = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const desdeClave = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diaISO = d => (d.getDay() + 6) % 7 + 1;
const fCorta = d => d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : '';
const fHora = d => d ? `${fCorta(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const diasEntre = (a, b) => Math.round((b - a) / 864e5);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nomTransp = t => (t || '').replace(/-\d+$/, '').trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function preparar(json) {
  const ix = Object.fromEntries(json.columnas.map((c, i) => [c, i]));
  const filas = json.registros.map(a => {
    const r = {};
    for (const c in ix) r[c] = a[ix[c]];
    r.fSolD = r.fSol ? new Date(r.fSol) : null;
    r.fGesD = r.fGes ? new Date(r.fGes) : null;
    r.solK = r.fSolD ? clave(r.fSolD) : '';
    r.gesK = r.fGesD ? clave(r.fGesD) : '';
    r.entrega = RE_ENTREGA.test(r.nota);
    r.pendiente = r.estado === 'Nuevo' || r.estado === 'Asignado';
    r.txt = norm([r.dir, r.edif, r.transp, r.nota, r.obs, r.mun].join(' '));
    return r;
  });
  const gen = new Date(json.generado);
  HOY = new Date(gen.getFullYear(), gen.getMonth(), gen.getDate());
  HOYk = clave(HOY);
  // Atraso igual que la hoja "Atrasados": semanas desde el último día de
  // servicio del municipio anterior a hoy (si hoy es el día, cuenta el de la semana pasada)
  for (const r of filas) {
    r.semanas = null;
    if (r.estado !== 'Nuevo' || r.entrega || !r.fSolD) continue;
    const delta0 = ((diaISO(HOY) - (DIA_SERVICIO[r.mun] || 1)) % 7 + 7) % 7;
    const prev = sumarDias(HOY, -(delta0 === 0 ? 7 : delta0));
    const d = desdeClave(r.solK);
    r.semanas = d >= prev ? 0 : Math.min(4, Math.ceil(diasEntre(d, prev) / 7));
  }
  return { filas, calendario: [], generado: gen };
}

// ── filtros ─────────────────────────────────────────────────────────────────
const pasaMuni = r => !st.munis.size || st.munis.has(r.mun);
const pasaQ = r => !st.q || r.txt.includes(st.q);
const base = () => D.filas.filter(r => pasaMuni(r) && pasaQ(r));

// ── conjuntos que replican las hojas de la planilla ─────────────────────────
function conjuntos() {
  const B = base();
  return {
    B,
    pendientes: B.filter(r => r.pendiente),
    atrasados: B.filter(r => r.semanas >= 1).sort((a, b) => a.fSolD - b.fSolD),
    ingresos: B.filter(r => r.solK === HOYk),
    gestiones: B.filter(r => r.gesK === HOYk).sort((a, b) => b.fGesD - a.fGesD),
  };
}

// ── semana ──────────────────────────────────────────────────────────────────

function renderSemana(C) {
  // El calendario es fijo: "Hoy" va según el reloj, no según la fecha de la copia de datos
  const hoyIso = diaISO(new Date());
  $('semana').innerHTML = D.calendario.slice(0, 6).map((c, i) => {
    const fijos = c.vaciadosFijos || [];
    return `<div class="dia ${i + 1 === hoyIso ? 'hoy' : ''}">
      <div class="dia-n"><span>${DIAS[i]}</span>${i + 1 === hoyIso ? '<span class="dia-hoy">Hoy</span>' : ''}</div>
      <div class="dia-sec dia-sec-cols"><span>Municipios</span><svg class="dia-fl" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg><span>Descarga</span></div>
      <div class="dia-rows">${c.municipios.map(x => `
        ${chipMuni(x.municipio, true)}
        <svg class="dia-fl" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
        <span class="dia-p">${esc(x.planta)}</span>`).join('')}
      </div>
      <div class="dia-sec sig">Vaciados fijos</div>
      <div class="dia-fijos">${fijos.length ? fijos.map(v => `
        <div class="fv" style="--c:${COLOR_MUNI[v.municipio] || COL.gris}">
          <span class="mb">${esc(v.municipio)}</span>
          <div class="fv-n">${esc(v.nombre)}</div>
        </div>`).join('') : '<div class="dia-vacio">Sin vaciados fijos</div>'}
      </div></div>`;
  }).join('');
}

// ── ficha de un punto del mapa ──────────────────────────────────────────────
function colorDe(r) {
  if (r.estado === 'Asignado') return COL.asig;
  if (r.estado === 'Nuevo') return r.semanas >= 1 ? COL.atr : COL.pend;
  return (r.cantB || 0) > 0 ? COL.hecho : COL.gris;
}

function fichaHTML(r) {
  const estado = r.estado === 'Nuevo' && r.semanas >= 1 ? ['Atrasado ' + (r.semanas >= 4 ? '4+ sem.' : r.semanas + ' sem.'), COL.atr, '#F9E1E0']
    : r.estado === 'Nuevo' ? ['Nuevo', COL.pend, '#FCE9DF']
    : r.estado === 'Asignado' ? ['Asignado', COL.asig, '#E1ECFA'] : [r.estado, '#0f7a55', '#DDF3EA'];
  const fila = (k, v) => v || v === 0 ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  const dias = r.fSolD ? diasEntre(desdeClave(r.solK), r.fGesD ? desdeClave(r.gesK) : HOY) : null;
  return `<button class="ficha-x" aria-label="Cerrar">×</button>
    <h3>${esc(r.dir)}</h3>
    <div class="sub">${esc(r.edif && norm(r.edif) !== norm(r.dir) ? r.edif + ' · ' : '')}${esc(r.tipoEdif)} · Municipio ${chipMuni(r.mun)}</div>
    <hr>
    <div style="margin-bottom:.5rem"><span class="est" style="--c:${estado[1]};--bg-c:${estado[2]}">${esc(estado[0])}</span></div>
    <dl>
      ${fila('Solicitud', r.fSolD ? fHora(r.fSolD) + (dias != null ? ` · hace ${dias} d` : '') : '')}
      ${fila('Pedido', r.cantSol != null ? fmt(r.cantSol) + (r.entrega ? ' · entrega/cambio' : '') : '')}
      ${fila('Teléfono', r.telefono)}
      ${fila('Nota', r.nota)}
      ${r.fGesD ? fila('Gestión', fHora(r.fGesD) + ` · ${dias} d después`) : ''}
      ${fila('Transportista', nomTransp(r.transp) === '' || r.transp === '-' ? '' : nomTransp(r.transp))}
      ${r.fGesD ? fila('Bolsones', `${fmt(r.cantB)}${r.tipoB ? ' · ' + r.tipoB : ''}`) : ''}
      ${fila('Planta', r.planta)}
      ${fila('Observación', r.obs)}
      ${fila('Solicitud n.º', r.id)}
    </dl>`;
}

// ── mapa grande de Operación del día ────────────────────────────────────────
// Se crea recién cuando la pestaña está visible (Leaflet necesita tamaño real).
let mapaOp = null, capaOp, marcadoresOp = new Map(), selOp = null;
const rendOp = L.canvas({ padding: .3 }); // cada mapa necesita su propio dibujador
const VER_OP = { realizados: true, pendientes: true, asignados: true };
// Con gestión hoy = realizado, aunque la planilla todavía lo tenga "Asignado" sin cerrar
// (igual que la hoja "Informe realizados"). Asignados = los que todavía no se gestionaron.
const grupoOp = r => r.gesK === HOYk ? 'realizados' : r.estado === 'Asignado' ? 'asignados' : 'pendientes';

function renderMapaOp(C) {
  if (!$('mapaOp').offsetWidth) return;
  let primera = false;
  if (!mapaOp) {
    mapaOp = L.map('mapaOp', { zoomControl: true, preferCanvas: true }).setView([-34.86, -56.16], 12);
    L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
      maxNativeZoom: 18, maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO',
    }).addTo(mapaOp);
    mapaOp.attributionControl.setPrefix(false);
    capaOp = L.layerGroup().addTo(mapaOp);
    mapaOp.on('click', cerrarFichaOp);
    primera = true;
  }
  mapaOp.invalidateSize();
  const todos = [...new Set([...C.gestiones, ...C.pendientes])];
  const n = { realizados: 0, pendientes: 0, asignados: 0 };
  for (const r of todos) n[grupoOp(r)]++;
  const def = [['realizados', 'Realizados', COL.hecho], ['pendientes', 'Pendientes', COL.pend], ['asignados', 'Asignados', COL.asig]];
  $('opToggles').innerHTML = def.map(([k, l, c]) => `<button class="tg ${VER_OP[k] ? '' : 'off'}" data-k="${k}" style="--c:${c}"><i></i><span class="num">${n[k]}</span> ${l}</button>`).join('');
  $('opToggles').querySelectorAll('.tg').forEach(b => b.onclick = () => { VER_OP[b.dataset.k] = !VER_OP[b.dataset.k]; renderMapaOp(conjuntos()); });

  capaOp.clearLayers(); marcadoresOp.clear();
  const P = todos.filter(r => r.lat && r.lng && VER_OP[grupoOp(r)]);
  const orden = r => ({ realizados: 1, asignados: 2, pendientes: r.semanas >= 1 ? 4 : 3 })[grupoOp(r)];
  for (const r of P.sort((a, b) => orden(a) - orden(b))) {
    const m = L.circleMarker([r.lat, r.lng], {
      renderer: rendOp, radius: grupoOp(r) === 'realizados' ? 4 + Math.sqrt(r.cantB || 0) * 2.2 : 6,
      color: '#fff', weight: 1.5, fillColor: grupoOp(r) === 'realizados' ? ((r.cantB || 0) > 0 ? COL.hecho : COL.gris) : colorDe(r), fillOpacity: .9,
    }).bindTooltip(esc(r.dir), { direction: 'top', offset: [0, -6] })
      .on('click', e => { L.DomEvent.stopPropagation(e); seleccionarOp(r); });
    m.addTo(capaOp); marcadoresOp.set(r.id, m);
  }
  if (primera && P.length) mapaOp.fitBounds(L.latLngBounds(P.map(r => [r.lat, r.lng])), { padding: [30, 30] });
  if (selOp) { if (marcadoresOp.has(selOp.id)) seleccionarOp(selOp); else cerrarFichaOp(); }
}

function seleccionarOp(r) {
  selOp = r;
  marcadoresOp.forEach((m, id) => m.setStyle(id === r.id ? { color: '#1A1714', weight: 3 } : { color: '#fff', weight: 1.5 }));
  marcadoresOp.get(r.id)?.bringToFront();
  $('fichaOp').innerHTML = fichaHTML(r);
  $('fichaOp').classList.add('on');
  $('fichaOp').querySelector('.ficha-x').onclick = cerrarFichaOp;
}
function cerrarFichaOp() {
  selOp = null; $('fichaOp').classList.remove('on');
  marcadoresOp.forEach(m => m.setStyle({ color: '#fff', weight: 1.5 }));
}

// ── gráficas ────────────────────────────────────────────────────────────────
Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";
Chart.defaults.font.size = 12;
Chart.defaults.color = '#5F5A54';
Chart.defaults.plugins.tooltip.enabled = false; // sin etiquetas negras al pasar el mouse
const graficas = {};
const ejes = (horiz, apilado) => ({
  x: { stacked: apilado, grid: { display: !!horiz, color: '#EEEBE5', drawTicks: false }, border: { display: false }, ticks: { padding: 6, precision: 0 } },
  y: { stacked: apilado, grid: { display: !horiz, color: '#EEEBE5', drawTicks: false }, border: { display: false }, ticks: { padding: 6, precision: 0 }, beginAtZero: true },
});

function grafica(id, cfg, vacio) {
  graficas[id]?.destroy();
  const cont = $(id).parentElement;
  cont.querySelector('.g-vacio')?.remove();
  if (vacio) { cont.insertAdjacentHTML('beforeend', '<div class="g-vacio">Sin datos hoy</div>'); graficas[id] = null; return; }
  graficas[id] = new Chart($(id), cfg);
}

function barrasH(id, etiquetas, series) {
  $(id).parentElement.style.height = Math.max(150, etiquetas.length * 30 + 50) + 'px';
  grafica(id, {
    type: 'bar',
    data: { labels: etiquetas, datasets: series.map(s => ({ borderRadius: 4, borderSkipped: false, maxBarThickness: 18, categoryPercentage: .8, barPercentage: .9, ...s })) },
    options: {
      indexAxis: 'y', maintainAspectRatio: false, animation: { duration: 250 },
      plugins: { legend: { display: false } },
      scales: ejes(true, series.length > 1),
    },
  }, !etiquetas.length);
}

function renderGraficas(C) {
  // 4. Gestiones por transportista (período)
  const porT = {};
  for (const r of C.gestiones) {
    if (!r.transp || r.transp === '-') continue;
    const t = (porT[r.transp] ||= { n: 0, b: 0, s: 0 });
    t.n++; t.b += r.cantB || 0; if (!(r.cantB > 0)) t.s++;
  }
  const tops = Object.entries(porT).sort((a, b) => b[1].n - a[1].n).slice(0, 15);
  barrasH('cTransp', tops.map(([t]) => nomTransp(t)), [
    { label: 'Con bolsones', data: tops.map(([, v]) => v.n - v.s), backgroundColor: COL.hecho },
    { label: 'Sin bolsones', data: tops.map(([, v]) => v.s), backgroundColor: '#CFCAC2' },
  ]);

  // 5. Bolsones descargados por planta (período)
  const porP = {};
  for (const r of C.gestiones) if (r.planta) porP[r.planta] = (porP[r.planta] || 0) + (r.cantT || 0);
  const pl = Object.entries(porP).sort((a, b) => b[1] - a[1]);
  barrasH('cPlanta', pl.map(x => x[0]), [{ data: pl.map(x => x[1]), backgroundColor: COL.asig }]);

  // 6. Ingresos por tipo de edificio (período)
  const porE = {};
  for (const r of C.ingresos) porE[r.tipoEdif || 'Sin dato'] = (porE[r.tipoEdif || 'Sin dato'] || 0) + 1;
  const ed = Object.entries(porE).sort((a, b) => b[1] - a[1]);
  barrasH('cEdif', ed.map(x => x[0]), [{ data: ed.map(x => x[1]), backgroundColor: '#6250d6' }]);

  // 7. Tipo de bolsón (período)
  const porB = {};
  for (const r of C.gestiones) if (r.cantB > 0) porB[r.tipoB || 'Sin dato'] = (porB[r.tipoB || 'Sin dato'] || 0) + r.cantB;
  const tb = Object.entries(porB).sort((a, b) => b[1] - a[1]);
  barrasH('cTipo', tb.map(x => x[0]), [{ data: tb.map(x => x[1]), backgroundColor: '#0f7a55' }]);

  renderCalor(C);
}

function renderCalor(C) {
  const H0 = 6, H1 = 20, m = {};
  let max = 0;
  for (const r of C.gestiones) {
    const d = diaISO(r.fGesD), h = r.fGesD.getHours();
    if (h < H0 || h > H1 || d > 6) continue;
    const k = d + '-' + h; m[k] = (m[k] || 0) + 1; max = Math.max(max, m[k]);
  }
  const ramp = ['#E7F0FC', '#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
  let html = '<span></span>';
  for (let h = H0; h <= H1; h++) html += `<span class="lx">${h}</span>`;
  for (let d = 1; d <= 6; d++) {
    html += `<span class="ly">${DIAS[d - 1].slice(0, 3)}</span>`;
    for (let h = H0; h <= H1; h++) {
      const v = m[d + '-' + h] || 0;
      const bg = v ? ramp[Math.min(ramp.length - 1, Math.floor(v / max * (ramp.length - 1)))] : '';
      html += `<span class="c" style="${bg ? 'background:' + bg : ''}"></span>`;
    }
  }
  $('calor').innerHTML = html;
}

// ── render general ──────────────────────────────────────────────────────────
function render() {
  const C = conjuntos();
  renderSemana(C); renderGraficas(C); renderMapaOp(C); renderAtrasados(C); renderBorrar(C); renderIngreso();
}

// ── pestaña Atrasados: misma tabla y detalle que la hoja "Atrasados" ────────
function renderAtrasados(C) {
  // Solo vaciados en estado Nuevo con al menos una semana de atraso (r.semanas viene de preparar())
  const atr = C.B.filter(r => r.semanas >= 1);
  // Municipios en el orden en que se atienden en la semana (según el calendario): B F A G E C D CH
  const orden = [...new Set(D.calendario.flatMap(c => c.municipios.map(x => x.municipio)).filter(m => MUNIS.includes(m)))];
  const det = C.atrasados.slice().sort((a, b) => orden.indexOf(a.mun) - orden.indexOf(b.mun) || a.fSolD - b.fSolD);

  // Matriz semanas × municipio. Las casillas con atrasados van en el azul de la barra, más intenso cuantos más hay
  const max = Math.max(1, ...orden.flatMap(m => [1, 2, 3, 4].map(i => atr.filter(r => r.mun === m && r.semanas === i).length)));
  let html = `<div class="hm-h izq"></div>${orden.map(m => `<div class="hm-h">${chipMuni(m)}</div>`).join('')}`;
  ATRASO.forEach((a, i) => {
    if (!i) return; // "Sin atraso" no se muestra
    html += `<div class="hm-l">${a.n}</div>`;
    html += orden.map(m => {
      const n = atr.filter(r => r.mun === m && r.semanas === i).length;
      const fondo = n ? `background:color-mix(in srgb, #1b3f74 ${Math.round((.55 + .45 * n / max) * 100)}%, #FFFFFF);color:#fff` : '';
      return `<div class="hc ${n ? '' : 'cero'}" style="${fondo}">${n}</div>`;
    }).join('');
  });
  $('hmAtraso').innerHTML = html;

  // Detalle: ordenado por municipio y fecha, como la hoja. El municipio se ve por el color de la izquierda.
  const ICO_RELOJ = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  // Sin atrasados: la tabla queda vacía y el recuadro del detalle lo avisa
  $('atLista').innerHTML = det.length ? `<div class="at-lista">${det.map(r => `
    <div class="at-it" style="--m:${COLOR_MUNI[r.mun] || COL.gris}">
      <div class="at-dir">${esc(r.dir)}</div>
      <div class="at-sub"><span>${ICO_CAL}Solicitada ${fHora(r.fSolD)}</span><span>${ICO_RELOJ}hace ${diasEntre(desdeClave(r.solK), HOY)} días</span></div>
      ${r.nota ? `<div class="at-desc">${esc(r.nota)}</div>` : ''}
    </div>`).join('')}</div>`
    : '<div class="at-vacio">No hay solicitudes atrasadas</div>';
}

// ── pestaña Para borrar: misma lógica que la hoja "Repetidos" ───────────────
// Sobre las solicitudes abiertas (Nuevo o Asignado):
//  - Direcciones repetidas: la misma dirección aparece más de una vez.
//  - Descripción para borrar: el texto de la solicitud dice "borrar".
const ICO_CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

function renderBorrar(C) {
  const grupos = {};
  for (const r of C.pendientes) (grupos[r.dir.trim().toLowerCase()] ||= []).push(r);
  const rep = Object.values(grupos).filter(g => g.length > 1)
    .map(g => g.sort((a, b) => a.fSolD - b.fSolD))
    .sort((a, b) => a[0].dir.localeCompare(b[0].dir));
  $('repLista').innerHTML = rep.length ? `<div class="at-lista">${rep.map(g => `
    <div class="at-it" style="--m:${COLOR_MUNI[g[0].mun] || COL.gris}">
      <div class="at-dir">${esc(g[0].dir)}</div>
      <div class="rep-sol">${g.map(r => `
        <div class="rep-fila"><b>${esc(r.estado)}</b><span class="at-sub" style="display:inline-flex"><span>${ICO_CAL}Solicitada ${fHora(r.fSolD)}</span></span></div>
        ${r.nota ? `<div class="at-desc">${esc(r.nota)}</div>` : ''}`).join('')}
      </div>
    </div>`).join('')}</div>`
    : '<div class="at-vacio">No hay direcciones repetidas</div>';

  const bor = C.pendientes.filter(r => /borrar/i.test(r.nota)).sort((a, b) => a.dir.localeCompare(b.dir));
  $('borLista').innerHTML = bor.length ? `<div class="at-lista">${bor.map(r => `
    <div class="at-it" style="--m:${COLOR_MUNI[r.mun] || COL.gris}">
      <div class="at-dir">${esc(r.dir)}</div>
      <div class="rep-fila"><b>${esc(r.estado)}</b><span class="at-sub" style="display:inline-flex"><span>${ICO_CAL}Solicitada ${fHora(r.fSolD)}</span></span></div>
      <div class="at-desc">${esc(r.nota)}</div>
    </div>`).join('')}</div>`
    : '<div class="at-vacio">No hay solicitudes para borrar</div>';
}

// ── pestaña Ingreso: misma lógica que la hoja "Seguimiento ingreso" ─────────
// Solicitudes cuya fecha de solicitud cae en el día elegido, ordenadas por hora.
// Se separan en dos tablas: arriba las que les falta teléfono u horario en la descripción,
// abajo las que tienen las dos cosas. El teléfono viene marcado en los datos (r.tel), porque
// el número se borra antes de publicar; el horario se busca en el texto.
const RE_HORARIO = new RegExp([
  String.raw`\b\d{1,2}(:\d{2})?\s*(a|al|-|–)\s*\d{1,2}(:\d{2})?\b`,           // 8 a 12, 7:30 a 10:30
  String.raw`\b\d{1,2}:\d{2}\b`,                                               // 13:30
  String.raw`\b\d{1,2}\s*(hs?|hrs?|horas)\b`,                                  // 17 hs
  String.raw`(desde|despu[eé]s de|a partir de|antes de|hasta|luego de)\s+(las?\s+)?\d`, // a partir de las 9
  String.raw`\b(ma[ñn]ana|tarde|noche|mediod[ií]a|medio d[ií]a)\b`,            // en la mañana
].join('|'), 'i');
// Se busca en la nota sin teléfonos, para que los dígitos de un número no parezcan un horario
const tieneHorario = r => RE_HORARIO.test(r.notaPub ?? r.nota ?? '');

// "Datos de la solicitud" va última en las dos tablas: es la que se lleva el espacio sobrante
function filasIngreso(L_, conFalta) {
  if (!L_.length) return `<tr><td colspan="${conFalta ? 6 : 5}" class="at-vacio">No hay solicitudes</td></tr>`;
  return L_.map(r => `<tr>
      <td>${chipMuni(r.mun)}</td>
      <td class="dir">${esc(r.dir)}</td>
      <td class="hora">${pad(r.fSolD.getHours())}:${pad(r.fSolD.getMinutes())}</td>
      <td class="num">${r.cantSol != null ? fmt(r.cantSol) : ''}</td>
      ${conFalta ? `<td>${r.tel ? '' : '<span class="falta">Teléfono</span>'}${tieneHorario(r) ? '' : '<span class="falta">Horario</span>'}</td>` : ''}
      <td class="desc">${esc(r.nota)}</td></tr>`).join('');
}

// Municipio, Dirección, Hora y Cantidad con el mismo ancho en las dos tablas, para que queden alineadas
// (se mide cada tabla con su ancho justo y después se fija el mayor en todas las celdas de esa columna,
// porque un ancho puesto solo en el encabezado pierde contra el width:1% de las celdas)
function igualarColumnas() {
  const tablas = [$('tIngFalta'), $('tIngOk')];
  const celdas = (t, i) => [...t.querySelectorAll(`tr > :nth-child(${i + 1})`)].filter(c => !c.colSpan || c.colSpan === 1);
  for (const t of tablas) for (let i = 0; i < 4; i++) celdas(t, i).forEach(c => c.style.width = '');
  if (!$('tIngOk').offsetWidth) return; // pestaña oculta: se iguala al mostrarla
  for (let i = 0; i < 4; i++) {
    const ancho = Math.ceil(Math.max(...tablas.map(t => t.querySelector(`thead th:nth-child(${i + 1})`).getBoundingClientRect().width)));
    for (const t of tablas) celdas(t, i).forEach(c => c.style.width = ancho + 'px');
  }
}

function renderIngreso() {
  const dias = D.filas.map(r => r.solK).filter(Boolean).sort();
  const inp = $('ingDia');
  inp.min = dias[0]; inp.max = HOYk;
  if (!st.ingDia) st.ingDia = HOYk;
  inp.value = st.ingDia;
  const L_ = base().filter(r => r.solK === st.ingDia).sort((a, b) => a.fSolD - b.fSolD);
  const ok = L_.filter(r => r.tel && tieneHorario(r)), falta = L_.filter(r => !(r.tel && tieneHorario(r)));
  $('ingTot').innerHTML = `<b class="num">${L_.length}</b> ${L_.length === 1 ? 'solicitud' : 'solicitudes'}`;
  const cab = extra => `<thead><tr><th>Municipio</th><th>Dirección</th><th>Hora</th><th>Cantidad</th>${extra ? '<th>Falta</th>' : ''}<th>Datos de la solicitud</th></tr></thead>`;
  $('tIngFalta').innerHTML = cab(true) + `<tbody>${filasIngreso(falta, true)}</tbody>`;
  $('tIngOk').innerHTML = cab(false) + `<tbody>${filasIngreso(ok, false)}</tbody>`;
  igualarColumnas();
}
$('ingDia').onchange = e => { st.ingDia = e.target.value || HOYk; renderIngreso(); };

// Categorías. La primera se abre por defecto; las demás quedan en la URL (#pendientes) para que al recargar siga ahí.
const CATS = ['organizacion', 'atrasados', 'operacion', 'borrar', 'ingreso'];
function mostrarCat(k) {
  document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', b.dataset.cat === k));
  document.querySelectorAll('.cat').forEach(c => c.classList.toggle('on', c.dataset.cat === k));
  history.replaceState(null, '', k === CATS[0] ? location.pathname + location.search : '#' + k);
  // Lo que se dibujó con la pestaña oculta (tamaño 0) se rehace al mostrarla
  if (!D) return;
  if (k === 'ingreso') igualarColumnas();
  if (k !== 'operacion') return;
  const C = conjuntos(); renderGraficas(C); renderMapaOp(C);
}
document.querySelectorAll('#cats button').forEach(b => b.onclick = () => mostrarCat(b.dataset.cat));
if (CATS.includes(location.hash.slice(1))) mostrarCat(location.hash.slice(1));

// Datos privados (cifrados en el repo): teléfono y descripciones completas de cada solicitud.
// La contraseña se pone una vez en la portada; si se entra directo a esta página, se pide acá.
async function privados() {
  try {
    const llave = await COMLlave.obtener('../bases/llave.json');
    return await COMLlave.abrir(llave, '../bases/bolsones-privado.json');
  } catch (err) {
    console.warn('Sin datos privados:', err.message);
    return null;
  }
}

// Reemplaza en cada solicitud los textos públicos (sin teléfonos) por los completos
function sumarPrivados(priv) {
  if (!priv) return;
  for (const r of D.filas) {
    const p = priv[r.id];
    if (!p) continue;
    r.notaPub = r.nota;
    r.nota = p[0] || r.nota;
    r.obs = p[1] || r.obs;
    r.edif = p[2] || r.edif;
    r.telefono = p[3];
  }
}

// La base se actualiza desde el botón de Bolsones del menú principal; acá solo se lee al abrir
async function cargar() {
  try {
    const sep = CONFIG.fuente.includes('?') ? '&' : '?';
    const [res, cal, priv] = await Promise.all([
      fetch(CONFIG.fuente + sep + 't=' + Date.now(), { cache: 'no-store' }),
      fetch(CONFIG.calendario + sep + 't=' + Date.now(), { cache: 'no-store' }),
      privados(),
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (!cal.ok) throw new Error('calendario HTTP ' + cal.status);
    D = preparar(await res.json());
    D.calendario = (await cal.json()).dias;
    sumarPrivados(priv);
    render();
    $('cargador')?.remove();
  } catch (err) {
    $('cargador').textContent = 'No se pudieron cargar los datos (' + err.message + ').';
  }
}
cargar();

window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
